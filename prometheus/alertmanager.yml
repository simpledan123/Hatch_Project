global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: webhook

receivers:
  - name: webhook
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname