global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# ── 통계 대시보드 ─────────────────────────────────────────────────────────
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node
    stats show-legends
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}

# ── L7 HTTP 프론트엔드 ──────────────────────────────────────────────────
frontend http_front
    bind *:80
    default_backend backend_pool

# ── 백엔드 풀 (헬스체크 기반 자동 페일오버) ──────────────────────────────
backend backend_pool
    balance roundrobin

    # 헬스체크: /api/health/live 를 3초마다 확인
    # 2회 연속 실패 시 자동 제외, 3회 연속 성공 시 복귀
    option httpchk GET /api/health/live
    http-check expect status 200
    default-server inter 3s fall 2 rise 3

    server backend1 backend:8000 check
    server backend2 backend2:8000 check backup
